# Core Split Roles
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_SPLIT_ROLE_PERIPHERAL=y

# Core Input Pipelines
CONFIG_SPI=y                    
CONFIG_INPUT=y                   
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_INPUT_SPLIT=y

# Activate Badjeff's Driver Engine
CONFIG_PMW3610_ALT=y

# Crucial Performance & Stability Overrides for Wireless
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=20
CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=1000
