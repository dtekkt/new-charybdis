# charybdis_dongle.conf
# Dongle = USB BLE central. Left + right are both peripherals.
# Receives relayed trackball from the right peripheral via ZMK input split.

# ── Split / central role ───────────────────────────────────────────────────
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2   # left + right

# ── USB (dongle is always plugged in) ─────────────────────────────────────
CONFIG_USB_DEVICE_STACK=y
CONFIG_ZMK_USB=y

# ── Receive relayed trackball from right peripheral ────────────────────────
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_INPUT_SPLIT=y

# ── Display stack ─────────────────────────────────────────────────────────
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_LV_Z_VDB_SIZE=64
CONFIG_LV_DPI_DEF=148

# ── zmk-dongle-display options ─────────────────────────────────────────────
CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=y
CONFIG_ZMK_DONGLE_DISPLAY_LAYER_TEXT_ALIGN="center"
CONFIG_ZMK_WPM=y
CONFIG_ZMK_DONGLE_DISPLAY_WPM=y

# ── Battery service lives on peripherals, not on the dongle ───────────────
CONFIG_BT_BAS=n

# ── Dongle is USB-powered, no sleep needed ────────────────────────────────
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=0
