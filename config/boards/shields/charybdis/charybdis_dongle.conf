# charybdis_dongle.conf
# Dongle = USB BLE central. Left + right are both peripherals.

# ── Split / central role ───────────────────────────────────────────────────
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# ── USB ───────────────────────────────────────────────────────────────────
CONFIG_USB_DEVICE_STACK=y
CONFIG_ZMK_USB=y

# ── Bluetooth Stack Scale-up (Crucial for 3-Device Topology) ──────────────
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6

# Optimize BLE tuning parameters for low-latency trackball data
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# ── Pointing / Input (Updated for badjeff's framework) ────────────────────
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_PMW3610_ALT=n

# ── Display ───────────────────────────────────────────────────────────────
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Give the background rendering thread and main loop adequate memory bounds
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Buffer sizes for LVGL
CONFIG_LV_Z_VDB_SIZE=64
CONFIG_LV_DPI_DEF=148

# ── zmk-dongle-display ────────────────────────────────────────────────────
CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=y
# CONFIG_ZMK_DONGLE_DISPLAY_LAYER_TEXT_ALIGN="center"
CONFIG_ZMK_WPM=y
CONFIG_ZMK_DONGLE_DISPLAY_WPM=y

# ── Battery service lives on the peripherals ──────────────────────────────
CONFIG_BT_BAS=n

# ── ZMK Studio ────────────────────────────────────────────────────────────
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=y
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# Change the default auto-mouse layer drop timeout to 1.5 seconds (1500ms)
CONFIG_ZMK_INPUT_PROCESSOR_TEMP_LAYER_TIMEOUT_MS=1500
