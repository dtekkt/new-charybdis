CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
CONFIG_BT_PERIPHERAL_PREF_LATENCY=2

CONFIG_BT_BUF_ACL_TX_COUNT=24
CONFIG_BT_BUF_EVT_RX_COUNT=10
CONFIG_BT_L2CAP_TX_BUF_COUNT=32

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y   

CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512 

CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y   
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y      
CONFIG_ZMK_EXT_POWER=y  

# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=15
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=15

CONFIG_ZMK_KEYBOARD_NAME="Charybdis"

CONFIG_PMW3610_ALT_RUN_DOWNSHIFT_TIME_MS=100

# Sensor camera sampling interval during rest states (in milliseconds)
CONFIG_PMW3610_ALT_REST1_SAMPLE_TIME_MS=50
CONFIG_PMW3610_ALT_REST2_SAMPLE_TIME_MS=200
CONFIG_PMW3610_ALT_REST3_SAMPLE_TIME_MS=1000

# Time spent in each rest stage before downshifting further (in milliseconds)
CONFIG_PMW3610_ALT_REST1_DOWNSHIFT_TIME_MS=3000
CONFIG_PMW3610_ALT_REST2_DOWNSHIFT_TIME_MS=6000

# ── DEEP SLEEP STANDBY (30 Minutes) ──
# Shuts down the wireless transmitters entirely if left untouched for half an hour
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=2100000
